name: GOVERNANCA — piloto F3 (diagnóstico)

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
    paths:
      - ".governanca/config.yml"
      - ".github/workflows/governance-integration.yml"
  pull_request:
    paths:
      - ".governanca/config.yml"
      - ".github/workflows/governance-integration.yml"

permissions:
  contents: read

concurrency:
  group: governance-integration-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  governance-diagnosis:
    uses: carlos-andrade/GOVERNANCA/.github/workflows/governance-integration-reusable.yml@e5a7499d3a8a0877f4fc99774bb604a90f01e6f3
    with:
      config_path: .governanca/config.yml
      mode: diagnostico
      source_ref: e5a7499d3a8a0877f4fc99774bb604a90f01e6f3
